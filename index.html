<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<title>Liga Fueguina de Truco</title>
<meta name="description" content="Tabla de posiciones de la Liga de Truco Ushuaia.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="sheet">
:root{
  color-scheme:light dark;
  --bg:#1b3b21; --card:#fbf6de; --card-2:#f3ecc4;
  --ink:#171b12; --ink-2:#4b5b3f; --ink-3:#5c6b4e;
  --rule:#e4dba0; --rule-2:#d8cc85;
  --brand:#eee82c; --brand-ink:#171b12; --brand-soft:rgba(238,232,44,.22);
  --accent:#4c7a16; --up:#4c7a16; --down:#b24a1f;
  --card-border:rgba(15,30,10,.85);
  --radius:10px; --radius-lg:22px; --radius-pill:999px;
  --display:"Anton","Archivo Black",Impact,sans-serif;
  --body:"Baloo 2","Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --script:"Rye",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a140c; --card:#1e2c18; --card-2:#283b21;
    --ink:#ede8d2; --ink-2:#9fae8c; --ink-3:#8fa07d;
    --rule:rgba(237,232,210,.14); --rule-2:rgba(237,232,210,.26);
    --brand:#eee82c; --brand-ink:#171b12; --brand-soft:rgba(238,232,44,.16);
    --accent:#8fcb4e; --up:#8fcb4e; --down:#e8895a;
    --card-border:rgba(238,232,44,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0a140c; --card:#1e2c18; --card-2:#283b21;
  --ink:#ede8d2; --ink-2:#9fae8c; --ink-3:#8fa07d;
  --rule:rgba(237,232,210,.14); --rule-2:rgba(237,232,210,.26);
  --brand:#eee82c; --brand-ink:#171b12; --brand-soft:rgba(238,232,44,.16);
  --accent:#8fcb4e; --up:#8fcb4e; --down:#e8895a;
  --card-border:rgba(238,232,44,.4);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
::selection{background:var(--brand-soft)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0ms!important}}

.wrap{max-width:860px;margin:clamp(10px,3vw,26px) auto;background:var(--card);color:var(--ink);border-radius:clamp(12px,3vw,var(--radius-lg));border:clamp(2px,.6vw,3px) solid var(--card-border);padding:0 0 6px}
.wrap>*{padding-left:clamp(14px,3.5vw,30px);padding-right:clamp(14px,3.5vw,30px)}
.admin.wrap{max-width:660px;padding-bottom:110px}

header.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-top:22px!important;padding-bottom:14px!important}
header.mast h1{margin:0;font:400 clamp(30px,6vw,46px)/.95 var(--display);letter-spacing:.01em;text-transform:uppercase}
header.mast .sub{margin:5px 0 0;font:600 12.5px/1.4 var(--body);color:var(--ink-2)}
header.mast .rnd{flex:0 0 auto;background:var(--brand);color:var(--brand-ink);font:800 12px/1 var(--body);letter-spacing:.03em;text-transform:uppercase;padding:8px 14px;border-radius:var(--radius-pill);white-space:nowrap;margin-top:2px}

.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:14px 0 13px;font:600 11.5px/1 var(--body);color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em}
input[type="search"]{appearance:none;width:210px;max-width:52vw;font:400 13px var(--body);color:var(--ink);padding:7px 12px;background:var(--card-2);border:2px solid var(--rule-2);border-radius:var(--radius-pill)}
input[type="search"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.tw{overflow-x:auto}
table.pos{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums;font-size:16px}
table.pos thead th{font:700 11.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:0 10px 8px;border-bottom:3px solid var(--bg);white-space:nowrap}
table.pos thead th.pos,table.pos thead th.par{text-align:left}
table.pos tbody td{padding:11px 10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.pos tbody td.pos{text-align:left;color:var(--ink-3);font:700 15px/1 var(--body);width:2.9rem}
table.pos tbody td.pos .mv{margin-left:4px;font-size:11px;font-weight:800}
.mv.up{color:var(--up)} .mv.down{color:var(--down)}
table.pos tbody td.par{text-align:left;white-space:normal}
.par .a{font-weight:700;font-size:16px}
.par .b{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
table.pos tbody td.pts{font:400 21px/1 var(--display);letter-spacing:.02em}
table.pos tbody tr:hover td{background:var(--card-2)}
table.pos tbody tr.top td.pos{color:var(--ink)}
table.pos tbody tr.r1 td.pos .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:-1px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:14px;font-weight:800}
.emptyrow td{padding:24px 10px!important;text-align:center!important;color:var(--ink-2);font-style:italic}
@media (max-width:560px){table.pos tbody td.par .b{display:none}table.pos tbody td{padding:9px 8px}}

footer.foot{margin:16px 0 26px;padding-top:14px!important;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:flex-start;font-size:11.5px;color:var(--ink-2)}
footer.foot .rule{max-width:60ch;display:flex;flex-direction:column;gap:4px;font-size:13px}
footer.foot .rule-pts b{font-weight:800;color:var(--ink)}
footer.foot .rule-tie{color:var(--ink-3);font-size:12px}
footer.foot .credit{width:100%;font:400 22px/1 var(--script);color:var(--ink-3)}
footer.foot .credit-row{width:100%;display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:12px;margin-top:10px}
footer.foot .credit-row .credit{width:auto}
footer.foot .credit-row .madeby{width:auto;margin-top:0;margin-left:auto;padding-top:0;border-top:0}
footer.foot .lnks{display:flex;gap:14px;white-space:nowrap}
.madeby{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);text-decoration:none}
.madeby .seal{position:relative;flex:0 0 auto;width:32px;height:32px;border-radius:8px;background:#0a0a0a;color:#f8f6f2;display:flex;align-items:center;justify-content:center;font:800 12px/1 var(--body);letter-spacing:-.02em;overflow:hidden}
.madeby .seal::before{content:"";position:absolute;top:0;right:0;width:13px;height:13px;background:#c2461f;clip-path:polygon(100% 0,0 0,100% 100%)}
.madeby:hover .seal{opacity:.85}
.madeby .txt{display:flex;flex-direction:column;gap:2px;line-height:1}
.madeby .txt .k{font:700 9px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.madeby .txt .v{font:700 13px/1 var(--body);color:var(--ink)}
.lk{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.atop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:20px!important;padding-bottom:12px!important;border-bottom:3px solid var(--bg)}
.atop h2{margin:0;font:400 24px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.gate{max-width:320px;margin:52px auto}
.gate h2{font:400 22px/1 var(--display);text-transform:uppercase;margin:0 0 14px}
.g{margin:0;padding:16px 0 2px}
.g+.g{border-top:1px solid var(--rule-2);margin-top:4px}
.g .gh{margin:0;font:700 11px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fr{margin:11px 0 0}
.fg{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px}
.fg>.fr{flex:1 1 150px;margin-top:0}
.admin label.l{display:block;margin:0 0 3px;font-size:11.5px;color:var(--ink-2)}
.admin input[type=text],.admin input[type=number],.admin input[type=password],.admin select,.admin textarea{width:100%;font:400 13.5px var(--body);color:var(--ink);padding:11px 13px;background:var(--card-2);border:2px solid var(--rule-2);border-radius:var(--radius)}
.admin input:focus-visible,.admin select:focus-visible,.admin textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.admin textarea{min-height:80px;resize:vertical;font:400 12px var(--body)}
.plist{display:flex;flex-direction:column;margin-top:9px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px 0;border-bottom:1px solid var(--rule)}
.pl .nm{grid-column:1/-1}
.pl .rm{grid-column:1/-1;justify-self:end;appearance:none;border:0;background:none;color:var(--down);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font-size:11.5px}
table.grid{width:100%;border-collapse:collapse;margin-top:11px;font-variant-numeric:tabular-nums}
table.grid th{font:700 9.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:0 6px 6px;border-bottom:2px solid var(--rule-2)}
table.grid th:first-child{text-align:left}
table.grid td{padding:9px 6px;border-bottom:1px solid var(--rule);text-align:right}
table.grid td:first-child{text-align:left;font-size:12.5px}
table.grid .gp{font:400 15px var(--display)}
.btn{appearance:none;font:700 13px var(--body);padding:9px 18px;border-radius:var(--radius-pill);border:2px solid var(--ink);background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.o{background:none;border-color:var(--rule-2);color:var(--ink)}
.btn.s{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.abar{position:sticky;bottom:0;z-index:5;margin-top:20px;padding:12px 0;background:var(--card);border-top:3px solid var(--bg);display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.abar .st{flex:1 1 100%;font:600 11.5px/1.4 var(--body);color:var(--ink-2)}
.abar .st.w{color:var(--down)} .abar .st.k{color:var(--up)}
.msg{position:relative;margin-top:12px;padding:10px 28px 10px 12px;font-size:12px;line-height:1.5;border:2px solid var(--rule-2);border-left:4px solid var(--brand);border-radius:var(--radius);color:var(--ink);background:var(--card-2)}
.msg .x{position:absolute;top:5px;right:7px;background:none;border:0;color:var(--ink-2);font-size:15px;cursor:pointer;line-height:1}
.msg textarea{width:100%;min-height:110px;margin-top:7px;font:400 10.5px var(--body)}
details.bk summary{font:600 12px var(--body);color:var(--accent);cursor:pointer}
code{font-size:11px;background:var(--card-2);padding:1px 4px;border-radius:4px}

.h1btn{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.h1btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.atop .lnks,footer.foot .lnks{display:flex;gap:14px;white-space:nowrap;align-items:center}

.wrap.home{padding-top:6px;padding-bottom:6px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(28px,7vw,52px)!important;padding-bottom:6px!important}
.hero-flyer-wrap{position:relative;display:inline-block;max-width:260px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 22px 44px -16px rgba(0,0,0,.55);animation:card-flip .9s cubic-bezier(.22,1,.36,1) both}
.hero-flyer-wrap::after{content:"";position:absolute;top:-60%;left:-35%;width:35%;height:220%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-80%) rotate(0deg);animation:shine 1s ease .82s 1 both;pointer-events:none}
.hero-flyer{display:block;width:100%;height:auto}
.hero-tag{margin:20px 0 0;font-family:var(--body);font-weight:600;font-style:italic;font-size:clamp(13px,4.2vw,19px);line-height:1.3;letter-spacing:.01em;color:var(--ink-2);white-space:nowrap;opacity:0;animation:rise-in .5s ease-out .78s both}
.hero-sub{margin:8px 0 0;font:700 11.5px/1.4 var(--body);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;opacity:0;animation:rise-in .5s ease-out .88s both}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.hero-actions .btn{opacity:0;animation:rise-in .5s ease-out both}
.hero-actions .btn:nth-child(1){animation-delay:.95s}
.hero-actions .btn:nth-child(2){animation-delay:1.07s}
.btn.big{padding:15px 26px;font-size:14px}
.home-foot{justify-content:center;text-align:center;margin-top:30px}
.home-foot .credit-row{border-top:0;padding-top:0;margin-top:0}
.info-cta{display:flex;justify-content:center;padding-top:22px}
.info-foot .madeby{border-top:0;padding-top:0;margin-top:0}
@keyframes card-flip{0%{opacity:0;transform:perspective(1000px) rotateY(-95deg) translateY(20px) scale(.93)}55%{opacity:1}100%{opacity:1;transform:perspective(1000px) rotateY(0deg) translateY(0) scale(1)}}
@keyframes shine{0%{transform:translateX(-80%) rotate(0deg)}100%{transform:translateX(680%) rotate(0deg)}}
@keyframes rise-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.info{margin-top:4px}
.info-block{padding:18px 0;border-top:1px solid var(--rule)}
.info-block:first-child{border-top:0}
.info-block h2{margin:0 0 8px;font:400 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.info-block p{margin:0;color:var(--ink-2);line-height:1.65;max-width:56ch}
@media (min-width:680px){
  .info{display:grid;grid-template-columns:1.3fr 1fr;column-gap:56px;align-items:start}
  .info-block{border-top:0}
  .info-block+.info-block{border-top:0;border-left:1px solid var(--rule);margin-left:-28px;padding-left:28px}
}
.info-block p.venue{font-size:13.5px}
.info-block p.venue a{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:2px solid var(--rule-2)}
.info-block p.venue a:hover{border-color:var(--accent)}
.info-block p.ptslabel{margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}
.ptslist{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;max-width:44ch}
.ptslist li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:13px}
.ptslist li b{font:400 15px var(--display);color:var(--ink)}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.social{display:inline-flex;padding:8px 15px;border-radius:var(--radius-pill);background:var(--card-2);border:2px solid var(--rule-2);color:var(--ink);font:700 12.5px var(--body);text-decoration:none}
.social:hover{border-color:var(--accent);color:var(--accent)}
.social:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

  function setBy(path, value) {
    var p = path.split(".");
    if (p[0] === "meta") {
      var k = p[1];
      if (k === "resultPts") {
        state.meta.resultPts = state.meta.resultPts || {};
        state.meta.resultPts[p[2]] = Math.max(0, num(value));
      }
      else if (k === "fecha" || k === "totalFechas") state.meta[k] = num(value);
    } else if (p[0] === "pair") {
      var pr = null;
      for (var i = 0; i < state.pairs.length; i++) if (state.pairs[i].id === p[1]) pr = state.pairs[i];
      if (pr) pr[p[2]] = String(value);
    }
    view.dirty = true;
    saveDraft();
  }

  function wireAdmin() {
    var root = app.querySelector(".admin");
    root.addEventListener("input", function (e) {
      var el = e.target;
      if (!el.getAttribute || !el.getAttribute("data-b")) return;
      var b = el.getAttribute("data-b");
      setBy(b, el.type === "checkbox" ? el.checked : el.value);
      var st = app.querySelector(".abar .st");
      if (st) { st.textContent = "Cambios sin publicar."; st.className = "st w"; }
    });
    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el.getAttribute && el.getAttribute("data-fecha-pick")) {
        view.fechaPicks = view.fechaPicks || {};
        view.fechaPicks[el.getAttribute("data-fecha-pick")] = el.value;
      }
    });
    root.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-a]") : null;
      if (!b) return;
      var a = b.getAttribute("data-a");
      if (a === "back") backToBoard();
      else if (a === "closemsg") { var mm = b.parentNode; if (mm && mm.parentNode) mm.parentNode.removeChild(mm); }
      else if (a === "discard") discardDraft();
      else if (a === "addpair") addPair();
      else if (a === "delpair") delPair(b.getAttribute("data-pid"));
      else if (a === "imppairs") impPairs();
      else if (a === "setpw") setPw();
      else if (a === "applyfecha") applyFecha();
      else if (a === "draft") { saveDraft(); flash("Borrador guardado en este navegador."); }
      else if (a === "download") downloadPage();
      else if (a === "expjson") expJSON();
      else if (a === "impjson") impJSON();
      else if (a === "impjsongo") impJSONGo();

    if (mta) mta.addEventListener("focus", function () { try { mta.select(); } catch (e) {} });

  function addPair() {
    var k = state.pairs.length + 1, id;
    do { id = "p" + (k < 10 ? "0" : "") + k; k++; } while (state.pairs.some(function (p) { return p.id === id; }));
    state.pairs.push({ id: id, name: "", p1: "", p2: "" });
    state.meta.regions.forEach(function (r) { state.standings[r.id][id] = blank(); });
    view.dirty = true; saveDraft(); renderAdmin();

  function delPair(pid) {
    if (!pid || !confirm("¿Quitar esta pareja y sus resultados?")) return;
    state.pairs = state.pairs.filter(function (p) { return p.id !== pid; });
    state.meta.regions.forEach(function (r) { if (state.standings[r.id]) delete state.standings[r.id][pid]; });
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function applyFecha() {
    var region = view.adminRegion, picks = view.fechaPicks || {};
    var keys = Object.keys(picks).filter(function (pid) { return picks[pid]; });
    if (!keys.length) { flash("Elegí el resultado de al menos una pareja antes de aplicar."); return; }
    keys.forEach(function (pid) {
      var cell = state.standings[region][pid]; if (!cell) return;
      var res = picks[pid];
      cell.pts += num(state.meta.resultPts[res]);
      cell.fj += 1;
      if (res === "campeon") { cell.titulos++; cell.finales++; cell.semis++; }
      else if (res === "subcampeon") { cell.finales++; cell.semis++; }
      else if (res === "semifinalista") { cell.semis++; }
    });
    rankRows(region).forEach(function (r) { state.standings[region][r.pair.id].prevRank = r.rank; });
    view.fechaPicks = {};
    view.dirty = true; saveDraft();
    flash("Aplicado a " + keys.length + " pareja" + (keys.length === 1 ? "" : "s") + ". No olvides descargar la página para publicarlo.");
    renderAdmin();

  function impPairs() {

    if (!lines.length) return;
    if (!confirm("Reemplazar las " + state.pairs.length + " parejas por " + lines.length + " y poner los resultados en cero?")) return;
    state.pairs = lines.map(function (l, i) {
      var q = l.split(/[;|\t]/).map(function (s) { return s.trim(); });
      return { id: "p" + (i + 1 < 10 ? "0" : "") + (i + 1), name: q[2] || "", p1: q[0] || "", p2: q[1] || "" };
    });
    state.standings = {};
    state.meta.regions.forEach(function (r) {
      state.standings[r.id] = {};
      state.pairs.forEach(function (p) { state.standings[r.id][p.id] = blank(); });

  function buildDocument(st) {
    var css = document.getElementById("sheet").textContent;
    var js = document.getElementById("logic").textContent;
    var json = JSON.stringify(st).replace(/</g, "\\u003c").split(String.fromCharCode(8232)).join("\\u2028").split(String.fromCharCode(8233)).join("\\u2029");
    var S = "<" + "script", E = "<" + "/script>";
    return [
      "<!doctype html>", '<html lang="es" dir="ltr">', "<head>",
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<meta name="color-scheme" content="light dark">',
      "<title>" + esc(st.meta.leagueName) + "</title>",
      '<meta name="description" content="Tabla de posiciones de ' + esc(st.meta.leagueName) + '.">',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT + '">',
      '<style id="sheet">' + css + "</style>", "</head>", "<body>",
      '<div id="app"></div>',
      S + ' type="application/json" id="state">' + json + E,
      S + ' id="logic">' + js + E,
      "</body>", "</html>", ""
    ].join("\n");
  }
  function downloadBlob(name, text, type) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      if (a.parentNode) a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { return false; }
  }
  function claudeDownloads() {
    if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
    try { return Promise.resolve(window.claude.use("downloads")); } catch (e) { return Promise.resolve(null); }
  }
  function downloadPage() {
    var out = JSON.parse(JSON.stringify(state));
    normalize(out);
    out.meta.updatedAt = todayISO();
    var html = buildDocument(out);
    var okMsg = "Descargado <b>index.html</b>. Subilo a tu hosting reemplazando el anterior para publicar los cambios.";
    var done = function () {
      state = out; normalize(state);
      view.dirty = false; saveDraft();
      view.msg = okMsg; renderAdmin();
    };
    claudeDownloads().then(function (dl) {
      if (dl) {
        dl.save({ filename: "index.html", data: html }).then(done, function (err) {
          if (err && err.code === "declined") { view.msg = "Descarga cancelada."; renderAdmin(); return; }
          if (downloadBlob("index.html", html, "text/html;charset=utf-8")) done(); else copyFallback(html);
        });
      } else {
        if (downloadBlob("index.html", html, "text/html;charset=utf-8")) done(); else copyFallback(html);
      }
    });
  }
  function copyFallback(html) {
    view.msg = "No se pudo descargar acá. Copiá este texto y pegalo reemplazando el contenido de tu <b>index.html</b>:<textarea readonly>" + esc(html) + "</textarea>";
    renderAdmin();
  }
  function expJSON() {
    var data = JSON.stringify(state, null, 1);
    claudeDownloads().then(function (dl) {
      var fb = function () { if (!downloadBlob("liga-truco.json", data, "application/json")) { view.msg = "Guardá este texto como <code>liga-truco.json</code>:<textarea readonly>" + esc(data) + "</textarea>"; renderAdmin(); } };
      if (dl) dl.save({ filename: "liga-truco.json", data: data }).then(function () {}, fb);
      else fb();
    });
  }
  function impJSON() {
    view.msg = "Pegá el contenido del JSON:<textarea id=\"ij\"></textarea><button class=\"btn o s\" type=\"button\" data-a=\"impjsongo\" style=\"margin-top:7px\">Cargar</button>";
    renderAdmin();
  }
  function impJSONGo() {
    var ta = app.querySelector("#ij"); if (!ta) return;
    try {
      var parsed = JSON.parse(ta.value);
      if (!parsed || !parsed.pairs || !parsed.meta) throw new Error("formato");
      state = parsed; normalize(state);
      view.adminRegion = state.meta.regions[0].id; view.dirty = true; saveDraft();
      view.msg = "Datos importados."; renderAdmin();
    } catch (e) { alert("No se pudo leer ese JSON."); }
  }

  initTheme();
  initFromUrl();
  render();
})();
</script>
</body>
</html>
